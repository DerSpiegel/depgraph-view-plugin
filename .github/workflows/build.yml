name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - run: mvn clean package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: depgraph-view-hpi
          path: target/*.hpi
